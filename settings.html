<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aman.ai – Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="sidebar">
      <div class="sidebar-title">Aman.ai</div>

      <button class="sidebar-btn" onclick="window.location.href='newchat.html'">
        <span class="icon">+</span>
        New Chat
      </button>

      <div>
        <div class="sidebar-section-title">General</div>
        <button class="sidebar-btn" onclick="window.location.href='settings.html'">
          <span class="icon">⚙</span>
          Settings
        </button>
        <button class="sidebar-btn" onclick="window.location.href='search.html'">
          <span class="icon">🔍</span>
          Search
        </button>
      </div>
    </div>

    <div class="main">
      <div class="page-title">Settings</div>
      <div class="page-desc">
        
      </div>

      <div class="form-group">
        <label>Theme</label>
        <select>
          <option>Dark (Default)</option>
          <option>Light</option>
        </select>
      </div>

      <div class="form-group">
        <label>Language</label>
        <select>
          <option>English</option>
          <option>Arabic</option>
        </select>
      </div>

      <button class="primary-btn" onclick="alert('Settings saved.')">
        Save Settings
      </button>

      <button class="link-btn" onclick="window.location.href='aman.html'">
        ← Back to Home
      </button>
    </div>
  </div>
</body>
</html>
