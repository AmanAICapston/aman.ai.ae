<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aman.ai – Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="sidebar">
      <div class="sidebar-title">Aman.ai</div>

      <button class="sidebar-btn" onclick="window.location.href='newchat.html'">
        <span class="icon">+</span> <span data-tkey="newChat">New Chat</span>
      </button>

      <button class="sidebar-btn" onclick="window.location.href='index.html'">
        <span class="icon">🏠</span> <span data-tkey="home">Home</span>
      </button>

      <div>
        <div class="sidebar-section-title" data-tkey="general">General</div>

        <button class="sidebar-btn" onclick="window.location.href='settings.html'">
          <span class="icon">⚙</span> <span data-tkey="settings">Settings</span>
        </button>

        <button class="sidebar-btn" onclick="window.location.href='search.html'">
          <span class="icon">🔍</span> <span data-tkey="search">Search</span>
        </button>
      </div>

      <div id="sessionsList" style="display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;margin-top:4px;">
        <div class="sidebar-section-title" data-tkey="recentChats">Recent Chats</div>
      </div>

      <div id="sidebarAuth" style="margin-bottom:20px;padding:0 4px;"></div>
    </div>

    <div class="main" style="padding:32px 48px;">
      <div class="page-title" id="settingsTitle">Settings</div>
      <div class="page-desc" id="settingsDesc">Manage your preferences for Aman.ai.</div>

      <div class="form-group">
        <label id="themeLabel">Theme</label>
        <select id="themeSelect">
          <option value="dark" id="optDark">Dark (Default)</option>
          <option value="light" id="optLight">Light</option>
        </select>
      </div>

      <div class="form-group">
        <label id="langLabel">Language</label>
        <select id="langSelect">
          <option value="en" id="optEn">English</option>
          <option value="ar" id="optAr">Arabic</option>
        </select>
      </div>

      <div class="form-group">
        <label id="clearLabel">Clear Chat History</label>
        <button class="primary-btn" id="clearBtn" style="background:#ef4444;margin-top:0;" onclick="clearHistory()">
          Clear All History
        </button>
      </div>

      <button class="primary-btn" id="saveBtn" onclick="saveSettings()">Save Settings</button>

      <button class="link-btn" id="backBtn" onclick="window.location.href='index.html'">
        ← Back to Home
      </button>

      <div id="savedMsg" style="display:none;margin-top:12px;color:#4ade80;font-size:13px;"></div>
    </div>
  </div>

  <script src="sidebar.js"></script>

  <script>
    const API_BASE = "https://aman-ai-rl6v.onrender.com";

    applyTheme();
    applyLang();
    buildSidebar({ activePage: "settings" });

    document.getElementById("settingsTitle").textContent = t("settingsTitle");
    document.getElementById("settingsDesc").textContent  = t("settingsDesc");
    document.getElementById("themeLabel").textContent    = t("theme");
    document.getElementById("langLabel").textContent     = t("language");
    document.getElementById("optDark").textContent       = t("dark");
    document.getElementById("optLight").textContent      = t("light");
    document.getElementById("optEn").textContent         = t("english");
    document.getElementById("optAr").textContent         = t("arabic");
    document.getElementById("clearLabel").textContent    = t("clearHistory");
    document.getElementById("clearBtn").textContent      = t("clearBtn");
    document.getElementById("saveBtn").textContent       = t("saveSettings");
    document.getElementById("backBtn").textContent       = t("backHome");

    document.getElementById("themeSelect").value = localStorage.getItem("amanTheme") || "dark";
    document.getElementById("langSelect").value  = localStorage.getItem("amanLang")  || "en";

    function saveSettings() {
      const theme = document.getElementById("themeSelect").value;
      const lang  = document.getElementById("langSelect").value;

      localStorage.setItem("amanTheme", theme);
      localStorage.setItem("amanLang", lang);

      const msg = document.getElementById("savedMsg");
      msg.textContent = t("saved");
      msg.style.display = "block";

      setTimeout(() => {
        window.location.reload();
      }, 800);
    }

    async function clearHistory() {
      if (!confirm(t("clearHistory") + "?")) return;

      const token = localStorage.getItem("amanToken");

      if (!token) {
        alert(LANG === "ar" ? "يجب تسجيل الدخول أولاً." : "You must be logged in.");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/chat/history`, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + token }
        });

        if (!res.ok) {
          const e = await res.json();
          throw new Error(e.detail || "Failed to clear history.");
        }

        const msg = document.getElementById("savedMsg");
        msg.textContent = LANG === "ar" ? "✓ تم مسح السجل بنجاح." : "✓ History cleared.";
        msg.style.display = "block";

        setTimeout(() => msg.style.display = "none", 3000);

        loadSidebarSessions("sessionsList", null);

      } catch (err) {
        alert("Error: " + err.message);
      }
    }
  </script>
</body>
</html>
